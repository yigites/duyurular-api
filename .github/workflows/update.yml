name: Update Duyurular

on:
  schedule:
    # Her gün sabah saat 09:00'da çalışır (UTC saatiyle 06:00)
    # Türkiye saati (UTC+3) olduğu için 06:00 yazarsak TR saatiyle 09:00 olur.
    - cron: "0 6 * * *" 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Ensure latest main
        run: git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npm run update

      - name: Commit & Push
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data public
          git commit -m "Auto update multi duyurular" || echo "No changes"
          git push https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }} HEAD:main
